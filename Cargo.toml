[package]
name = "sephiria-workshop-prep"
version = "0.3.0"
edition = "2021"
description = "Sephiria mod preparation assistant with component discovery"
repository = "https://github.com/imkita339-afk/AveSepHelper"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[profile.release]
strip = true
lto = "thin"
